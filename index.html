<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Ecosystem Simulator | Interactive 3D Underwater World</title>
    <meta name="description" content="Dive into a cinematic 3D ocean ecosystem — hundreds of living marine creatures, volumetric god rays, real-time schooling AI, and moody deep-water lighting. Built with Three.js and bitECS." />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ocean Ecosystem Simulator | Interactive 3D Underwater World" />
    <meta property="og:description" content="A cinematic 3D ocean ecosystem — hundreds of living creatures, volumetric god rays, and moody deep-water lighting. Built with Three.js." />
    <meta property="og:image" content="https://ocean-simulator.vercel.app/og-image.png" />
    <meta property="og:url" content="https://ocean-simulator.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ocean Ecosystem Simulator | Interactive 3D Underwater World" />
    <meta name="twitter:description" content="A cinematic 3D ocean ecosystem — hundreds of living creatures, volumetric god rays, and moody deep-water lighting. Built with Three.js." />
    <meta name="twitter:image" content="https://ocean-simulator.vercel.app/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ocean-simulator.vercel.app/" />

    <!-- Theme color -->
    <meta name="theme-color" content="#1a5f7a" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" role="main">
      <h1 class="visually-hidden">Ocean Ecosystem Simulator</h1>
      <div id="app" aria-label="3D Ocean Simulation Canvas"></div>
    </main>

    <!-- Loading / title card: hero clip behind a title, fades out once the scene is live -->
    <div id="loading-screen" role="status" aria-live="polite">
      <video
        id="loading-video"
        autoplay
        muted
        loop
        playsinline
        poster="/hero-poster.jpg"
        aria-hidden="true"
      >
        <source src="/hero.mp4" type="video/mp4" />
      </video>
      <div id="loading-content">
        <p id="loading-kicker">Three.js · Real-time</p>
        <h2 id="loading-title">Cinematic Deep Ocean</h2>
        <p id="loading-sub">A living underwater ecosystem</p>
        <div id="loading-bar"><span></span></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #1a5f7a;
        color: white;
        padding: 8px 16px;
        z-index: 100;
        text-decoration: none;
      }
      .skip-link:focus {
        top: 0;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Loading / title card */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05131c;
        overflow: hidden;
        opacity: 1;
        transition: opacity 1.1s ease;
      }
      #loading-screen.loaded {
        opacity: 0;
        pointer-events: none;
      }
      #loading-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(1.05) brightness(0.8);
      }
      #loading-content {
        position: relative;
        text-align: center;
        color: #e6f6ff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 24px;
        background: radial-gradient(ellipse at center, rgba(3, 15, 24, 0.55), rgba(3, 15, 24, 0.15) 70%, transparent);
      }
      #loading-kicker {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #6fd6e8;
      }
      #loading-title {
        margin: 0;
        font-size: clamp(28px, 6vw, 56px);
        font-weight: 700;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
      }
      #loading-sub {
        margin: 8px 0 22px;
        font-size: clamp(13px, 2vw, 16px);
        color: #a9d6e5;
      }
      #loading-bar {
        width: 180px;
        height: 3px;
        margin: 0 auto;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #loading-bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #4dd0e1, transparent);
        animation: loading-sweep 1.3s ease-in-out infinite;
      }
      @keyframes loading-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-screen { transition: opacity 0.3s ease; }
        #loading-bar span { animation: none; width: 100%; opacity: 0.5; }
        #loading-video { display: none; }
      }
    </style>
  </body>
</html>
